    <path d="M34.5,68.0 L26.5,69.0 M81.5,69.0 L90.5,70.0" stroke="#90a4ae" stroke-width="1.1" stroke-linecap="round"/>
    <ellipse cx="25.2" cy="69.6" rx="2.5" ry="3.7" fill="#1e293b" stroke="#cfd8dc" stroke-width="0.5"/>
    <ellipse cx="91.8" cy="70.6" rx="2.7" ry="4.0" fill="#1e293b" stroke="#cfd8dc" stroke-width="0.5"/>
    <ellipse cx="91.5" cy="70.6" rx="1.5" ry="2.6" fill="#90a4ae" opacity="0.5"/>
