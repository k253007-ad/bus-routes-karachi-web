    <path d="M75.0,84.0
             L83.5,84.5
             L83.5,121.5
             L134.5,121.0
             L134.8,95.5
             C134.8,88.2 139.8,83.5 147.5,83.8
             L173.5,85.0
             C175.8,85.2 177.2,86.8 177.6,89.8
             L178.8,117.5
             C178.9,121.2 177.5,123.5 174.5,124.5
             L161.5,127.2
             L161.0,118.5
             C160.5,110.5 155.8,106.8 150.0,107.0
