          fill="#ffdb6c" stroke="#b27814" stroke-width="0.6" stroke-linejoin="round"/>

    <!-- Warm Orange Upper Belt Band on Front Cowl (#ffb04c) -->
    <path d="M32.5,83.5 L81.5,84.8 L82.2,93.2 L30.2,91.8 Z" fill="#ffb04c"/>
    <!-- Central Vertical Spine Ridge on Front Nose Cone -->
