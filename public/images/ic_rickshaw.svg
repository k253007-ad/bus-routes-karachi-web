    <circle cx="47.2" cy="109.3" r="5.6" fill="#e6e6e6" stroke="#1e293b" stroke-width="0.6"/>
    <circle cx="47.2" cy="109.3" r="4.3" fill="#e0f7fa" stroke="#0288d1" stroke-width="0.4"/>
