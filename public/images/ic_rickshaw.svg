             C53.0,42.8 71.0,42.5 85.5,43.8
             L161.5,50.5
             C171.5,51.5 177.2,58.0 177.6,68.8
             L177.2,85.5
             L146.5,84.2
             C139.5,83.8 135.2,79.5 135.0,72.0
             L134.5,59.5
             C134.2,55.2 131.0,53.0 125.5,52.6
             L83.0,50.8
             L81.8,85.0
             L32.2,83.8
             C34.2,70.2 37.2,57.2 40.6,47.5
             C41.0,46.0 41.5,45.2 42.0,44.8 Z"
