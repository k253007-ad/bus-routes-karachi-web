    <ellipse cx="150.8" cy="130.2" rx="6.3" ry="9.8" transform="rotate(4 150.8 130.2)" fill="none" stroke="#37474f" stroke-width="0.6" opacity="0.7"/>
    <ellipse cx="151.0" cy="130.2" rx="4.6" ry="7.2" transform="rotate(4 151.0 130.2)" fill="#e6e6e6" stroke="#263238" stroke-width="0.5"/>
