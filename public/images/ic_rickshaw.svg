    <path d="M58.5,52.2 L48.5,72.8" stroke="#455a64" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M43.8,68.8 L54.2,75.8" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>

