<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 36 190 128" width="190" height="128" role="img">
  <!-- ===================================================================== -->
  <!-- REAR AXLE UNDERCARRIAGE & FAR-SIDE REAR WHEEL (True 3-Wheeler Stance) -->
  <!-- ===================================================================== -->
  <g id="detail-undercarriage">
    <!-- Far-side rear wheel peeking slightly under the rear-right chassis -->
    <ellipse cx="118.0" cy="132.5" rx="6.2" ry="9.8" fill="#000000"/>
    <ellipse cx="118.0" cy="132.5" rx="3.4" ry="5.4" fill="#37474f"/>
    <ellipse cx="118.0" cy="132.5" rx="1.7" ry="2.7" fill="#90a4ae"/>
    <!-- Rear chassis cross-member & exhaust pipe hint -->
    <path d="M74,126 L156,124 L148,130 L82,130 Z" fill="#1e293b"/>
  </g>

  <!-- ===================================================================== -->
  <!-- OPEN-AIR CABIN INTERIOR: FAR-SIDE CANOPY WALL, SEATS & HANDLEBARS     -->
  <!-- ===================================================================== -->
  <g id="detail-open-cabin">
    <!-- Far-side inner rear canopy hood wall (seen in 3/4 depth at rear of cabin) -->
    <path d="M124.0,51.0 L166.0,54.5 L172.0,88.0 L152.0,122.0 L122.0,122.0 L122.0,88.0 C128.0,87.5 131.5,83.0 131.5,75.0 L131.5,56.0 Z" fill="#1e293b"/>
    <!-- Subtle inner roof underside shadow -->
    <path d="M78.0,49.5 L164.0,54.5 L164.0,60.0 L78.0,56.5 Z" fill="#162630"/>
    <!-- Translucent far-side windscreen/breeze opening (keeps the cabin open & airy!) -->
    <path d="M80.0,55.0 L131.5,57.5 L131.5,88.5 L80.0,87.5 Z" fill="#cbd5e1" opacity="0.22"/>
    <!-- Far-side yellow body edge visible at bottom of open cabin -->
    <path d="M80.0,87.5 L125.0,88.0 L125.0,122.0 L80.0,122.0 Z" fill="#e89b46" opacity="0.35"/>

    <!-- Driver Seat & Steering Column (Front Cabin x=82..110) -->
    <!-- Steering Column & Black Handlebars -->
    <path d="M80.5,119.5 L85.5,86.5" stroke="#303e48" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M78.0,86.2 L94.5,88.0" stroke="#90a4ae" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M91.5,87.6 L97.5,88.4" stroke="#111827" stroke-width="3.0" stroke-linecap="round"/>
    <circle cx="85.8" cy="86.8" r="1.6" fill="#cfd8dc"/>
    <!-- Digital Fare Meter Box -->
    <rect x="82.5" y="81.2" width="5.8" height="4.0" rx="0.7" fill="#111827" stroke="#455a64" stroke-width="0.4"/>
    <rect x="83.4" y="82.0" width="3.8" height="1.9" fill="#76ff03" opacity="0.9"/>
    <!-- Driver Cushion Seat -->
    <path d="M89.5,98.5 L106.5,99.0 C108.8,99.1 110.0,100.8 109.6,103.5 L108.8,106.8 L89.0,106.2 Z" fill="#303e48" stroke="#162630" stroke-width="0.6"/>
    <path d="M91.5,106.2 L106.8,106.6 L106.2,122.5 L91.0,122.5 Z" fill="#1e293b"/>

    <!-- Rear Passenger Bench Seat (Signature Coral/Red #f44a46 & #fa6657 + #303e48 Headrest) -->
    <!-- Dark Slate Rounded Headrest (matching original ic_rickshaw.svg) -->
    <path d="M116.5,76.5 L146.5,77.5 C150.2,77.6 152.5,80.0 152.5,83.2 C152.5,86.4 150.0,88.6 146.2,88.6 L116.5,87.8 Z" fill="#303e48" stroke="#162630" stroke-width="0.6"/>
    <!-- Coral-Red Seat Backrest & Cushion -->
    <path d="M116.5,87.5 L146.5,88.4 L146.0,106.5 L116.0,105.8 Z" fill="#f44a46" stroke="#c62828" stroke-width="0.5"/>
    <path d="M113.0,104.0 L146.5,104.8 C148.8,104.9 150.0,106.8 149.6,109.5 L148.8,112.8 L112.5,112.0 Z" fill="#fa6657" stroke="#c62828" stroke-width="0.5"/>
    <!-- Coral Seat Lower Base with Orange Accent Bar -->
    <path d="M115.0,112.0 L147.5,112.6 L147.0,123.5 L114.5,123.5 Z" fill="#fa6657" stroke="#c62828" stroke-width="0.5"/>
    <path d="M119.5,118.2 L139.5,118.6" stroke="#e88937" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Vertical Silver Roof-Support Pillar (matching original #E6E6E6 bar) -->
    <path d="M111.5,53.5 L115.8,53.8 L115.2,123.0 L111.0,123.0 Z" fill="#e6e6e6" stroke="#94a3b8" stroke-width="0.5"/>
    <path d="M107.0,62.0 L107.0,85.0 M109.0,62.0 L109.0,85.0" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
    <!-- Cream Horizontal Passenger Grab Bar (matching original #fff5c9 bar) -->
    <path d="M98.0,108.5 L142.0,109.2" fill="none" stroke="#fff5c9" stroke-width="2.0" stroke-linecap="round" opacity="0.9"/>
  </g>

